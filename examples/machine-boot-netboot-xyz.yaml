---
apiVersion: vitistack.io/v1alpha1
kind: Machine
metadata:
  name: vm
  annotations:
    # Annotation to indicate we want to use a DataVolume for the boot source
    kubevirt.io/boot-source: "datavolume"
    kubevirt.io/boot-source-type: "http"
spec:
  machineClass: "medium"
  name: "vm"
  provider: kubevirt

  # Operating system configuration
  os:
    family: linux
    distribution: netboot.xyz
    version: "2.0.0"
    architecture: amd64
    # HTTP URL to the netboot.xyz ISO image
    # This will be used to create a DataVolume with CDI
    imageID: "https://boot.netboot.xyz/ipxe/netboot.xyz.iso"
  # Define disks - the ISO will be attached as a cdrom
  disks:
    - name: "root"
      sizeGB: 50
      boot: true
      type: "virtio"
      encrypted: false
